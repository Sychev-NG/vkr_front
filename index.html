<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Складской учёт | FIFO + Assembly</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-gray-100 font-sans antialiased">

<div x-data="warehouseApp()" x-init="init()" x-cloak class="flex h-screen">
    <!-- Sidebar -->
    <div class="w-64 bg-gradient-to-b from-indigo-900 to-indigo-800 text-white flex flex-col shadow-xl z-10">
        <div class="p-5 text-xl font-bold border-b border-indigo-700 flex items-center gap-2">
            <i class="fas fa-boxes"></i>
            <span>FIFO Склад</span>
        </div>
        
        <nav class="flex-1 p-3 space-y-1 overflow-y-auto">
            <template x-for="menu in menus" :key="menu.id">
                <button @click="activePage = menu.id; loadPageData(menu.id)" 
                        :class="{'bg-indigo-700 shadow-md': activePage === menu.id, 'hover:bg-indigo-800': true}"
                        class="w-full text-left px-3 py-2.5 rounded-lg flex items-center gap-3 transition-all duration-200">
                    <i :class="menu.icon + ' w-5'"></i>
                    <span x-text="menu.name" class="text-sm"></span>
                    <i x-show="menu.badge && alerts.length > 0" 
                       class="fas fa-circle text-yellow-400 text-xs ml-auto animate-pulse"></i>
                </button>
            </template>
        </nav>

            <div class="flex justify-between">
                <span class="text-indigo-300">Сервер:</span>
                <span class="font-mono text-indigo-200 truncate" x-text="baseUrl"></span>
            </div>
            <div class="flex justify-between">
                <span class="text-indigo-300">Статус:</span>
                <span :class="{'text-green-400': serverStatus, 'text-red-400': !serverStatus}" 
                      x-text="serverStatus ? '● Онлайн' : '● Офлайн'"></span>
            </div>
            <button @click="refreshAll" :disabled="loading"
                    class="w-full mt-2 bg-indigo-600 hover:bg-indigo-500 disabled:opacity-50 px-3 py-1.5 rounded text-white text-sm transition flex items-center justify-center gap-2">
                <i class="fas fa-sync-alt" :class="{'animate-spin': loading}"></i>
                <span x-text="loading ? 'Загрузка...' : 'Обновить'"></span>
            </button>
        </div> -->
    </div>

    <!-- Контейнер для динамических страниц -->
    <div class="flex-1 overflow-y-auto bg-gray-50" id="page-container">
        <div class="max-w-7xl mx-auto p-6" x-html="currentPageContent"></div>
    </div>
</div>

<!-- Модальные окна -->
<div x-show="productModalOpen" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50" 
     x-cloak @click.away="productModalOpen = false">
    <div class="bg-white rounded-xl shadow-2xl w-full max-w-md p-6 transform transition-all">
        <h3 class="text-xl font-bold mb-4" x-text="editingProduct ? '✏️ Редактировать товар' : '➕ Новый товар'"></h3>
        <div class="space-y-3">
            <input type="text" x-model="productForm.name" placeholder="Название товара" class="w-full border border-gray-300 rounded-lg p-2 focus:ring-2 focus:ring-indigo-500">
            <input type="text" x-model="productForm.unit" placeholder="Единица измерения (кг, шт, л)" class="w-full border border-gray-300 rounded-lg p-2">
            <input type="number" x-model="productForm.min_stock" placeholder="Минимальный остаток" class="w-full border border-gray-300 rounded-lg p-2">
        </div>
        <div class="flex gap-3 mt-6">
            <button @click="saveProduct" class="flex-1 bg-indigo-600 text-white py-2 rounded-lg hover:bg-indigo-700 transition">Сохранить</button>
            <button @click="productModalOpen = false" class="flex-1 border border-gray-300 py-2 rounded-lg hover:bg-gray-50 transition">Отмена</button>
        </div>
    </div>
</div>

<script src="js/api.js"></script>
<!-- <script src="js/state.js"></script> -->
<script src="js/app.js"></script>
</body>
</html>
