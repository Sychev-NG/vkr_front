<div class="bg-white rounded-xl shadow-lg overflow-hidden fade-in">
    <div class="px-6 py-4 border-b border-gray-200 bg-gradient-to-r from-gray-50 to-white flex justify-between items-center">
        <div>
            <h2 class="text-2xl font-bold text-gray-800">📦 Номенклатура</h2>
            <p class="text-sm text-gray-500 mt-1">Управление товарами и материалами</p>
        </div>
        <button @click="openProductModal()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-lg transition flex items-center gap-2 shadow-md">
            <i class="fas fa-plus"></i> Добавить товар
        </button>
    </div>
    
    <div class="overflow-x-auto">
        <table class="min-w-full divide-y divide-gray-200">
            <thead class="bg-gray-50">
                <tr>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">ID</th>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Название</th>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Ед. изм.</th>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Min остаток</th>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Действия</th>
                </tr>
            </thead>
            <tbody class="bg-white divide-y divide-gray-200">
                <template x-for="product in products" :key="product.id">
                    <tr class="hover:bg-gray-50 transition">
                        <td class="px-6 py-4 text-sm font-mono text-gray-600" x-text="product.id"></td>
                        <td class="px-6 py-4 text-sm font-medium text-gray-900" x-text="product.name"></td>
                        <td class="px-6 py-4 text-sm text-gray-600">
                            <span class="px-2 py-1 bg-gray-100 rounded-full text-xs" x-text="product.unit || '—'"></span>
                        </td>
                        <td class="px-6 py-4 text-sm">
                            <span :class="product.min_stock > 0 ? 'text-orange-600 font-medium' : 'text-gray-400'" x-text="product.min_stock || 0"></span>
                        </td>
                        <td class="px-6 py-4 text-sm space-x-3">
                            <button @click="openProductModal(product)" class="text-indigo-600 hover:text-indigo-900 transition">
                                <i class="fas fa-edit"></i>
                            </button>
                            <button @click="deleteProduct(product.id)" class="text-red-600 hover:text-red-900 transition">
                                <i class="fas fa-trash-alt"></i>
                            </button>
                        </td>
                    </tr>
                </template>
                <tr x-show="products.length === 0">
                    <td colspan="5" class="px-6 py-12 text-center text-gray-400">Нет товаров. Добавьте первый!</td>
                </tr>
            </tbody>
        </table>
    </div>
</div>
