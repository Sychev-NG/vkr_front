<div class="bg-white rounded-xl shadow-lg overflow-hidden fade-in">
    <div class="px-6 py-4 border-b border-gray-200 bg-gradient-to-r from-gray-50 to-white">
        <h2 class="text-2xl font-bold text-gray-800">📜 Журнал движений</h2>
        <p class="text-sm text-gray-500 mt-1">История всех операций со склада</p>
    </div>
    
    <!-- Фильтры -->
    <div class="p-4 bg-gray-50 border-b border-gray-200">
        <div class="grid grid-cols-1 md:grid-cols-4 gap-3">
            <!-- <input type="date" x-model="movementFilters.from" @change="loadMovements()" 
                   class="border border-gray-300 rounded-lg px-3 py-2 text-sm">
            <input type="date" x-model="movementFilters.to" @change="loadMovements()" 
                   class="border border-gray-300 rounded-lg px-3 py-2 text-sm"> -->
            <select x-model="movementFilters.product_id" @change="loadMovements()" class="border border-gray-300 rounded-lg px-3 py-2 text-sm">
                <option value="">Все товары</option>
                <template x-for="p in products">
                    <option :value="p.id" x-text="p.name"></option>
                </template>
            </select>
            <select x-model="movementFilters.warehouse_id" @change="loadMovements()" class="border border-gray-300 rounded-lg px-3 py-2 text-sm">
                <option value="">Все склады</option>
                <template x-for="wh in warehouses">
                    <option :value="wh.id" x-text="wh.name"></option>
                </template>
            </select>
        </div>
    </div>
    
    <div class="overflow-x-auto max-h-[500px]">
        <table class="min-w-full divide-y divide-gray-200">
            <thead class="bg-gray-50 sticky top-0">
                <tr>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500">Дата</th>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500">Товар</th>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500">Склад</th>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500">Тип</th>
                    <th class="px-6 py-3 text-right text-xs font-medium text-gray-500">Количество</th>
                    <!-- <th class="px-6 py-3 text-right text-xs font-medium text-gray-500">Себестоимость</th> -->
                </tr>
            </thead>
            <tbody class="bg-white divide-y divide-gray-200">
                <template x-for="m in movements" :key="m.id">
                    <tr class="hover:bg-gray-50">
                        <td class="px-6 py-4 text-sm text-gray-500" x-text="formatDate(m.created_at || m.date)"></td>
                        <td class="px-6 py-4 text-sm font-medium" x-text="m.product_name"></td>
                        <td class="px-6 py-4 text-sm text-gray-600" x-text="getWarehouseName(m.warehouse_id)"></td>
                        <td class="px-6 py-4 text-sm">
                            <span x-show="(m.stock_movement || m.quantity) > 0" class="text-green-600">
                                <i class="fas fa-arrow-down"></i> Приход
                            </span>
                            <span x-show="(m.stock_movement || m.quantity) < 0" class="text-red-600">
                                <i class="fas fa-arrow-up"></i> Расход
                            </span>
                        </td>
                        <td class="px-6 py-4 text-sm text-right font-mono" 
                            :class="(m.stock_movement || m.quantity) > 0 ? 'text-green-600' : 'text-red-600'"
                            x-text="formatNumber(m.stock_movement || m.quantity)"></td>
                        <!-- <td class="px-6 py-4 text-sm text-right text-gray-600" x-text="m.unit_cost ? formatNumber(m.unit_cost) + ' ₽' : '—'"></td> -->
                    </tr>
                </template>
            </tbody>
        </table>
    </div>
</div>
