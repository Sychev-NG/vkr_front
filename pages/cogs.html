<div class="max-w-4xl mx-auto">
    <div class="bg-white rounded-xl shadow-lg overflow-hidden fade-in">
        <div class="px-6 py-4 border-b border-gray-200 bg-gradient-to-r from-indigo-50 to-white">
            <h2 class="text-2xl font-bold text-gray-800">💰 Отчёт о себестоимости (COGS)</h2>
            <p class="text-sm text-gray-500 mt-1">Себестоимость отгруженных товаров за период</p>
        </div>
        
        <div class="p-6">
            <div class="flex gap-4 items-end mb-6">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">С даты</label>
                    <input type="date" x-model="cogsFrom" class="border border-gray-300 rounded-lg px-3 py-2">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">По дату</label>
                    <input type="date" x-model="cogsTo" class="border border-gray-300 rounded-lg px-3 py-2">
                </div>
                <div>
                    <button @click="loadCOGS()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-6 py-2 rounded-lg transition">
                        Рассчитать
                    </button>
                </div>
            </div>
            
            <div class="bg-gray-50 rounded-lg p-6 mb-6">
                <div class="text-center">
                    <div class="text-sm text-gray-500 mb-2">Общая себестоимость отгрузок</div>
                    <div class="text-4xl font-bold text-indigo-600" x-text="formatNumber(cogsTotal) + ' ₽'"></div>
                </div>
            </div>
            
            <div x-show="cogsDetails.length > 0">
                <h3 class="font-semibold text-gray-800 mb-3">📋 Детализация</h3>
                <div class="overflow-x-auto">
                    <table class="min-w-full divide-y divide-gray-200">
                        <thead class="bg-gray-50">
                            <tr>
                                <th class="px-4 py-2 text-left text-xs font-medium text-gray-500">Дата</th>
                                <th class="px-4 py-2 text-left text-xs font-medium text-gray-500">Товар</th>
                                <th class="px-4 py-2 text-right text-xs font-medium text-gray-500">Кол-во</th>
                                <th class="px-4 py-2 text-right text-xs font-medium text-gray-500">Себестоимость</th>
                            </tr>
                        </thead>
                        <tbody>
                            <template x-for="detail in cogsDetails" :key="detail.id">
                                <tr class="border-b">
                                    <td class="px-4 py-2 text-sm" x-text="formatDate(detail.date)"></td>
                                    <td class="px-4 py-2 text-sm" x-text="detail.product_name"></td>
                                    <td class="px-4 py-2 text-sm text-right" x-text="formatNumber(detail.quantity)"></td>
                                    <td class="px-4 py-2 text-sm text-right font-mono" x-text="formatNumber(detail.total_cost) + ' ₽'"></td>
                                </tr>
                            </template>
                        </tbody>
                    </table>
                </div>
            </div>
            
            <div x-show="cogsDetails.length === 0 && (cogsFrom || cogsTo)" class="text-center py-8 text-gray-400">
                Нет отгрузок за выбранный период
            </div>
        </div>
    </div>
</div>
