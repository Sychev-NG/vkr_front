<div class="bg-white rounded-xl shadow-lg overflow-hidden fade-in">
    <div class="px-6 py-4 border-b border-gray-200 bg-gradient-to-r from-gray-50 to-white flex justify-between items-center">
        <div>
            <h2 class="text-2xl font-bold text-gray-800">🏢 Склады</h2>
            <p class="text-sm text-gray-500 mt-1">Управление складскими помещениями</p>
        </div>
        <button @click="openWarehouseModal()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-lg transition flex items-center gap-2 shadow-md">
            <i class="fas fa-plus"></i> Добавить склад
        </button>
    </div>
    
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4 p-6">
        <template x-for="wh in warehouses" :key="wh.id">
            <div class="border border-gray-200 rounded-lg p-4 hover:shadow-md transition hover-card">
                <div class="flex justify-between items-start">
                    <div>
                        <h3 class="font-semibold text-lg text-gray-800" x-text="wh.name"></h3>
                        <p class="text-sm text-gray-500 mt-1" x-text="wh.address"></p>
                        <p class="text-xs text-gray-400 mt-2">ID: <span x-text="wh.id"></span></p>
                    </div>
                <!-- <button @click="openWarehouseModal(wh)" class="text-indigo-600 hover:text-indigo-900">
                    <i class="fas fa-edit"></i>
                </button> -->
                <button @click="deleteWarehouse(wh.id)" class="text-red-400 hover:text-red-600">
                    <i class="fas fa-trash-alt"></i>
                </button>
                </div>
            </div>
        </template>
        <div x-show="warehouses.length === 0" class="col-span-full text-center py-12 text-gray-400">
            Нет складов. Добавьте первый!
        </div>
    </div>
</div>
