<div class="bg-white rounded-xl shadow-lg overflow-hidden fade-in">
    <div class="px-6 py-4 border-b border-gray-200 bg-gradient-to-r from-gray-50 to-white flex justify-between items-center">
        <div>
            <h2 class="text-2xl font-bold text-gray-800">🔧 Спецификации сборки</h2>
            <!-- <p class="text-sm text-gray-500 mt-1">Bill of Materials (BOM)</p> -->
        </div>
        <button @click="openAssemblyModal()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-lg transition flex items-center gap-2 shadow-md">
            <i class="fas fa-plus"></i> Добавить спецификацию
        </button>
    </div>
    
    <div class="p-6 space-y-4">
        <template x-for="asm in assemblies" :key="asm.id">
            <div class="border border-gray-200 rounded-lg p-4 hover:shadow-md transition">
                <div class="flex justify-between items-start">
                    <div class="flex-1">
                        <div class="flex items-center gap-3">
                            <h3 class="font-bold text-lg text-gray-800" x-text="asm.name"></h3>
                            <span class="text-xs bg-purple-100 text-purple-700 px-2 py-1 rounded-full">
                                ID: <span x-text="asm.id"></span>
                            </span>
                        </div>
                        <div class="mt-2 text-sm text-gray-600">
                            <i class="fas fa-box-open mr-1"></i> Выход: 
                            <span class="font-medium" x-text="getProductName(asm.output_product_id)"></span>
                            <span x-text="' × ' + asm.output_quantity"></span>
                        </div>
                        <div class="mt-2 text-sm">
                            <span class="font-medium text-gray-700">📦 Компоненты:</span>
                            <div class="mt-1 flex flex-wrap gap-2">
                                <template x-for="comp in asm.components">
                                    <span class="bg-gray-100 px-2 py-1 rounded text-xs">
                                        <span x-text="getProductName(comp.product_id)"></span>
                                        <span class="text-gray-500">×</span>
                                        <span x-text="comp.quantity"></span>
                                    </span>
                                </template>
                            </div>
                        </div>
                    </div>
                    <div class="flex gap-2">
                        <button @click="openAssemblyModal(asm)" class="text-indigo-600 hover:text-indigo-800">
                            <i class="fas fa-edit"></i>
                        </button>
                        <button @click="deleteAssembly(asm.id)" class="text-red-400 hover:text-red-600">
                            <i class="fas fa-trash-alt"></i>
                        </button>
                    </div>
                </div>
            </div>
        </template>
        <div x-show="assemblies.length === 0" class="text-center py-12 text-gray-400">
            Нет спецификаций. Создайте первую!
        </div>
    </div>
</div>
