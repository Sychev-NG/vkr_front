<div class="bg-white rounded-xl shadow-lg overflow-hidden fade-in">
    <div class="px-6 py-4 border-b border-gray-200 bg-gradient-to-r from-gray-50 to-white flex justify-between items-center">
        <div>
            <h2 class="text-2xl font-bold text-gray-800">🤝 Контрагенты</h2>
            <p class="text-sm text-gray-500 mt-1">Поставщики и покупатели</p>
        </div>
        <button @click="createCounterparty()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-lg transition flex items-center gap-2 shadow-md">
            <i class="fas fa-plus"></i> Добавить контрагента
        </button>
    </div>
    
    <div class="overflow-x-auto">
        <table class="min-w-full divide-y divide-gray-200">
            <thead class="bg-gray-50">
                <tr>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500">ID</th>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500">Название</th>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500">Роль</th>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500">Действия</th>
                </tr>
            </thead>
            <tbody class="bg-white divide-y divide-gray-200">
                <template x-for="cp in counterparties" :key="cp.id">
                    <tr class="hover:bg-gray-50">
                        <td class="px-6 py-4 text-sm font-mono" x-text="cp.id"></td>
                        <td class="px-6 py-4 text-sm font-medium" x-text="cp.name"></td>
                        <td class="px-6 py-4 text-sm">
                            <span :class="cp.role === 'supplier' ? 'bg-blue-100 text-blue-800' : 'bg-green-100 text-green-800'" 
                                  class="px-2 py-1 rounded-full text-xs font-medium">
                                <i :class="cp.role === 'supplier' ? 'fas fa-truck' : 'fas fa-shopping-cart'"></i>
                                <span x-text="cp.role === 'supplier' ? 'Поставщик' : 'Покупатель'"></span>
                            </span>
                        </td>
                        <td class="px-6 py-4 text-sm">
                            <button @click="deleteCounterparty(cp.id)" class="text-red-500 hover:text-red-700">
                                <i class="fas fa-trash-alt"></i>
                            </button>
                        </td>
                    </tr>
                </template>
            </tbody>
        </table>
    </div>
</div>
