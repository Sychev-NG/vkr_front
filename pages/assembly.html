<div class="max-w-2xl mx-auto">
    <div class="bg-white rounded-xl shadow-lg overflow-hidden fade-in">
        <div class="px-6 py-4 border-b border-gray-200 bg-gradient-to-r from-purple-50 to-white">
            <h2 class="text-2xl font-bold text-gray-800">⚙️ Сборка продукции</h2>
            <p class="text-sm text-gray-500 mt-1">Создание готовой продукции из компонентов</p>
        </div>
        
        <div class="p-6 space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Спецификация *</label>
                <select x-model.number="assemblyForm.assembly_id" class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-purple-500">
                    <option value="">Выберите спецификацию</option>
                    <template x-for="asm in assemblies">
                        <option :value="asm.id" x-text="asm.name"></option>
                    </template>
                </select>
            </div>
            
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Склад *</label>
                <select x-model.number="assemblyForm.warehouse_id" class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-purple-500">
                    <option value="">Выберите склад</option>
                    <template x-for="wh in warehouses">
                        <option :value="wh.id" x-text="wh.name"></option>
                    </template>
                </select>
            </div>
            
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Количество наборов *</label>
                <input type="number" x-model.number="assemblyForm.quantity" min="1" class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-purple-500">
            </div>
            
            <div class="pt-4">
                <button @click="submitAssembly" :disabled="!assemblyForm.assembly_id || !assemblyForm.warehouse_id || !assemblyForm.quantity"
                        class="w-full bg-purple-600 hover:bg-purple-700 disabled:opacity-50 text-white font-semibold py-3 rounded-lg transition flex items-center justify-center gap-2">
                    <i class="fas fa-cogs"></i> Выполнить сборку
                </button>
            </div>
        </div>
    </div>
</div>
