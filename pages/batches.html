<div class="bg-white rounded-xl shadow-lg overflow-hidden fade-in">
    <div class="px-6 py-4 border-b border-gray-200 bg-gradient-to-r from-gray-50 to-white">
        <h2 class="text-2xl font-bold text-gray-800">🏷️ Партии товаров</h2>
        <p class="text-sm text-gray-500 mt-1">Остатки по партиям с себестоимостью</p>
    </div>
    
    <div class="overflow-x-auto">
        <table class="min-w-full divide-y divide-gray-200">
            <thead class="bg-gray-50">
                <tr>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500">Товар</th>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500">Склад</th>
                    <th class="px-6 py-3 text-right text-xs font-medium text-gray-500">Остаток</th>
                    <th class="px-6 py-3 text-right text-xs font-medium text-gray-500">Себестоимость</th>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500">Дата поступления</th>
                    <!-- <th class="px-6 py-3 text-left text-xs font-medium text-gray-500">Тип</th> -->
                </tr>
            </thead>
            <tbody class="bg-white divide-y divide-gray-200">
                <template x-for="batch in batches" :key="batch.id">
                    <tr class="hover:bg-gray-50">
                        <td class="px-6 py-4 text-sm font-medium" x-text="batch.product_name"></td>
                        <td class="px-6 py-4 text-sm text-gray-600" x-text="getWarehouseName(batch.warehouse_id)"></td>
                        <td class="px-6 py-4 text-sm text-right font-mono font-bold" x-text="formatNumber(batch.quantity_remaining)"></td>
                        <td class="px-6 py-4 text-sm text-right font-mono" x-text="formatNumber(batch.unit_cost) + ' ₽'"></td>
                        <td class="px-6 py-4 text-sm text-gray-500" x-text="formatDate(batch.created_at)"></td>
                        <!-- <td class="px-6 py-4 text-sm">
                            <span x-show="batch.incoming_doc_id" class="text-green-600 text-xs">📥 Приход</span>
                            <span x-show="batch.assembly_order_id" class="text-purple-600 text-xs">🔧 Сборка</span>
                        </td> -->
                    </tr>
                </template>
            </tbody>
        </table>
    </div>
</div>
